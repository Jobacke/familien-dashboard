<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Kalender Familie • Tages-Briefing & Dashboard</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Familie" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --content: #f1f5f9;
      --border: #e2e8f0;
      --muted-foreground: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0b0f19;
        --foreground: #f8fafc;
        --card: #111827;
        --content: #1e293b;
        --border: #334155;
        --muted-foreground: #94a3b8;
      }
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 md:p-6 selection:bg-emerald-500/20">
  <div class="max-w-5xl mx-auto space-y-5">

    <!-- Modern Streamlined Header -->
    <div class="relative overflow-hidden bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 sm:p-5 shadow-sm">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500"></div>
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5 min-w-0">
          <img src="icon.png" alt="Familie" onerror="this.style.display='none'" class="w-12 h-12 rounded-2xl shadow-sm border border-[var(--border)] flex-shrink-0 object-cover" />
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="text-lg sm:text-xl font-bold tracking-tight text-[var(--foreground)] truncate">
                Familien-Briefing
              </h1>
              <span class="px-2 py-0.5 rounded-md text-[11px] font-mono font-semibold bg-[var(--content)] text-[var(--muted-foreground)] border border-[var(--border)]">
                v1.2.0
              </span>
              <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Live
              </span>
            </div>
            <p class="text-xs text-[var(--muted-foreground)] truncate mt-0.5">
              Veronika & Johannes • <span id="sync-badge">Stand: wird geladen…</span>
            </p>
          </div>
        </div>

        <button id="btn-refresh" onclick="refreshCalendarData()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold bg-[var(--content)] text-[var(--foreground)] border border-[var(--border)] hover:border-emerald-500/40 hover:bg-emerald-500/10 transition cursor-pointer flex-shrink-0">
          <span id="refresh-icon" class="inline-block">🔄</span>
          <span class="hidden sm:inline">Aktualisieren</span>
        </button>
      </div>
    </div>

    <!-- 14-Tage Karussell / Day Selector -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">📅 14-Tage-Überblick</h2>
        <button onclick="selectToday()" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:underline cursor-pointer">
          Heute
        </button>
      </div>
      <div id="day-strip" class="flex items-stretch gap-2 overflow-x-auto pb-1"></div>
    </div>

    <!-- Main 2-Column Grid: Left = Selected Day Focus Briefing, Right = Tomorrow Preview & Quick Stats -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <!-- Selected Day Detailed Briefing (2 cols) -->
      <div class="lg:col-span-2 bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm flex flex-col justify-between space-y-4">
        <div class="space-y-3.5">
          <div class="flex items-center justify-between gap-2 border-b border-[var(--border)] pb-3">
            <div>
              <span id="selected-day-kicker" class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
                HEUTE
              </span>
              <h2 id="selected-day-title" class="text-lg font-bold text-[var(--foreground)]">
                Donnerstag, 29. Oktober 2026
              </h2>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="stepSelectedDay(-1)" class="px-2.5 py-1.5 rounded-lg text-xs border border-[var(--border)] bg-[var(--content)] hover:opacity-80 cursor-pointer" title="Vorheriger Tag">◀</button>
              <button onclick="stepSelectedDay(1)" class="px-2.5 py-1.5 rounded-lg text-xs border border-[var(--border)] bg-[var(--content)] hover:opacity-80 cursor-pointer" title="Nächster Tag">▶</button>
            </div>
          </div>

          <!-- Overnight Shift Banner (if previous night had Nachtschicht) -->
          <div id="overnight-banner" class="hidden rounded-xl px-3.5 py-2.5 bg-indigo-500/10 border border-indigo-500/30 text-xs"></div>

          <!-- Events for Selected Day -->
          <div id="selected-day-events" class="space-y-2.5"></div>
        </div>

        <!-- Compact Shift Hint (only shown when relevant) -->
        <div id="daily-smart-tip" class="hidden pt-3 border-t border-[var(--border)] flex items-center gap-2 text-xs text-[var(--muted-foreground)]"></div>
      </div>

      <!-- Right Column: Folgetag-Vorschau + 30-Tage-Statistik -->
      <div class="space-y-5">
        <!-- Next Day Preview Card -->
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm space-y-3">
          <div class="flex items-center justify-between border-b border-[var(--border)] pb-2.5">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">
                ⏭ FOLGETAG
              </span>
              <h3 id="next-day-title" class="text-sm font-bold text-[var(--foreground)]">
                Freitag, 30. Oktober
              </h3>
            </div>
            <button onclick="stepSelectedDay(1)" class="text-xs font-medium text-emerald-600 dark:text-emerald-400 hover:underline cursor-pointer">
              Öffnen →
            </button>
          </div>
          <div id="next-day-events" class="space-y-2"></div>
        </div>

        <!-- 30-Days Overview Stats -->
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm space-y-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">📊 Nächste 30 Tage</h3>
          <div class="grid grid-cols-2 gap-2.5" id="stats-grid"></div>
        </div>
      </div>
    </div>

    <!-- Complete Upcoming Timeline & Filter Section -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-[var(--border)] pb-3.5">
        <h2 class="text-sm font-bold text-[var(--foreground)]">🗂 Kommende Termine</h2>

        <div class="flex items-center gap-2">
          <input
            id="search-input"
            type="text"
            oninput="renderTimeline()"
            placeholder="Termine filtern…"
            class="px-3 py-1.5 rounded-xl text-xs bg-[var(--content)] text-[var(--foreground)] border border-[var(--border)] focus:outline-none focus:ring-2 focus:ring-emerald-500/40 w-full sm:w-52"
          />
        </div>
      </div>

      <!-- Filter Pills -->
      <div class="flex items-center gap-2 flex-wrap" id="filter-pills">
        <button onclick="setCategoryFilter('all')" data-filter="all" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer">
          Alle
        </button>
        <button onclick="setCategoryFilter('shift')" data-filter="shift" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer">
          🚑 Schichten
        </button>
        <button onclick="setCategoryFilter('family')" data-filter="family" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer">
          💛 Familie & Privat
        </button>
        <button onclick="setCategoryFilter('training')" data-filter="training" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer">
          🚴 Sport
        </button>
        <button onclick="setCategoryFilter('holiday')" data-filter="holiday" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer">
          🎉 Feiertage
        </button>
      </div>

      <!-- Timeline List -->
      <div id="timeline-container" class="space-y-3 pt-1"></div>
    </div>

  </div>

    function parseLocalDate(yyyyMmDd) {
      const [y, m, d] = yyyyMmDd.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatLocalDate(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, "0");
      const d = String(dt.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getLiveToday() {
      return formatLocalDate(new Date());
    }

    let appState = {
      data: CALENDAR_DATA,
      selectedDate: getLiveToday(),
      lastKnownToday: getLiveToday(),
      categoryFilter: "all",
    };

    const WEEKDAYS_SHORT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
    const WEEKDAYS_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
    const MONTHS_LONG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    function addDays(yyyyMmDd, offset) {
      const dt = parseLocalDate(yyyyMmDd);
      dt.setDate(dt.getDate() + offset);
      return formatLocalDate(dt);
    }

    function formatHumanDate(yyyyMmDd, includeYear = true) {
      const dt = parseLocalDate(yyyyMmDd);
      const wd = WEEKDAYS_LONG[dt.getDay()];
      const day = dt.getDate();
      const month = MONTHS_LONG[dt.getMonth()];
      return includeYear ? `${wd}, ${day}. ${month} ${dt.getFullYear()}` : `${wd}, ${day}. ${month}`;
    }

    function formatShortDate(yyyyMmDd) {
      const dt = parseLocalDate(yyyyMmDd);
      const wd = WEEKDAYS_SHORT[dt.getDay()];
      const day = String(dt.getDate()).padStart(2, "0");
      const month = String(dt.getMonth() + 1).padStart(2, "0");
      return `${wd}, ${day}.${month}.`;
    }

    function getCategoryStyle(category, badge) {
      if (category === "shift") {
        if (badge === "Nachtschicht") {
          return {
            pill: "bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 border-indigo-500/30",
            border: "border-l-4 border-l-indigo-500",
            dot: "bg-indigo-500"
          };
        }
        return {
          pill: "bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30",
          border: "border-l-4 border-l-rose-500",
          dot: "bg-rose-500"
        };
      }
      if (category === "training") {
        if (badge === "Regeneration") {
          return {
            pill: "bg-teal-500/15 text-teal-600 dark:text-teal-400 border-teal-500/30",
            border: "border-l-4 border-l-teal-500",
            dot: "bg-teal-500"
          };
        }
        return {
          pill: "bg-sky-500/15 text-sky-600 dark:text-sky-400 border-sky-500/30",
          border: "border-l-4 border-l-sky-500",
          dot: "bg-sky-500"
        };
      }
      if (category === "holiday") {
        return {
          pill: "bg-purple-500/15 text-purple-600 dark:text-purple-400 border-purple-500/30",
          border: "border-l-4 border-l-purple-500",
          dot: "bg-purple-500"
        };
      }
      return {
        pill: "bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30",
        border: "border-l-4 border-l-amber-500",
        dot: "bg-amber-500"
      };
    }

    function renderEventCard(ev, compact = false) {
      const st = getCategoryStyle(ev.category, ev.badge);
      const timeBadge = ev.isAllDay
        ? `<span class="px-2 py-0.5 rounded-md text-xs font-medium bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]">Ganztägig</span>`
        : `<span class="px-2 py-0.5 rounded-md text-xs font-semibold bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)]">🕒 ${ev.startTime} – ${ev.endTime} Uhr</span>`;

      let metaHtml = "";
      if (!compact && ev.category === "family" && ev.location) {
        metaHtml = `<div class="mt-1 text-xs text-[var(--muted-foreground)]">📍 ${ev.location.replace(/\n/g, ", ")}</div>`;
      }

      const calBadge = ev.calendar !== "familie"
        ? `<span class="px-2 py-0.5 rounded-md text-xs border border-[var(--border)] text-[var(--muted-foreground)]">${ev.calendarName}</span>`
        : `<span class="px-2 py-0.5 rounded-md text-xs border border-emerald-500/30 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">${ev.who}</span>`;

      return `
        <div class="bg-[var(--content)] border border-[var(--border)] ${st.border} rounded-xl p-3 transition hover:shadow-sm">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="space-y-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="px-2 py-0.5 rounded-md text-xs font-semibold border ${st.pill}">${ev.icon} ${ev.badge}</span>
                ${timeBadge}
                ${calBadge}
              </div>
              <h4 class="text-sm font-bold text-[var(--foreground)] pt-0.5 truncate">${ev.cleanTitle || ev.summary}</h4>
            </div>
            ${ev.htmlLink ? `<a href="${ev.htmlLink}" target="_blank" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] underline flex-shrink-0">↗</a>` : ""}
          </div>
          ${metaHtml}
        </div>
      `;
    }

    function renderDayStrip() {
      const strip = document.getElementById("day-strip");
      const today = getLiveToday();
      const events = appState.data.events || [];
      let html = "";

      for (let i = -1; i <= 14; i++) {
        const dStr = addDays(today, i);
        const dt = parseLocalDate(dStr);
        const wd = WEEKDAYS_SHORT[dt.getDay()];
        const dayNum = String(dt.getDate()).padStart(2, "0");
        const monthNum = String(dt.getMonth() + 1).padStart(2, "0");
        const isSelected = dStr === appState.selectedDate;
        const isToday = dStr === today;

        const dayEvents = events.filter(e => e.startDate === dStr);
        const dots = dayEvents.map(e => {
          const st = getCategoryStyle(e.category, e.badge);
          return `<span class="w-2 h-2 rounded-full ${st.dot}" title="${e.summary}"></span>`;
        }).join("");

        const btnClass = isSelected
          ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
          : isToday
          ? "bg-emerald-500/10 text-[var(--foreground)] border-emerald-500/40 hover:bg-emerald-500/20"
          : "bg-[var(--content)] text-[var(--foreground)] border-[var(--border)] hover:opacity-80";

        const subClass = isSelected ? "text-emerald-100" : "text-[var(--muted-foreground)]";

        html += `
          <button onclick="selectDate('${dStr}')" class="min-w-[74px] flex-shrink-0 rounded-xl p-2.5 border ${btnClass} flex flex-col items-center justify-between gap-1.5 transition cursor-pointer">
            <span class="text-xs font-semibold ${subClass}">${isToday ? "HEUTE" : wd}</span>
            <span class="text-sm font-bold">${dayNum}.${monthNum}.</span>
            <div class="flex items-center gap-1 min-h-[8px]">
              ${dots || `<span class="text-xs ${subClass}">–</span>`}
            </div>
          </button>
        `;
      }
      strip.innerHTML = html;
    }

    function renderSelectedDay() {
      const dStr = appState.selectedDate;
      const today = getLiveToday();
      const nextStr = addDays(dStr, 1);
      const events = appState.data.events || [];

      const kicker = document.getElementById("selected-day-kicker");
      if (dStr === today) {
        kicker.textContent = "☀️ HEUTE";
      } else if (dStr === addDays(today, 1)) {
        kicker.textContent = "⏭ MORGEN";
      } else {
        kicker.textContent = `📆 ${formatShortDate(dStr)}`;
      }

      document.getElementById("selected-day-title").textContent = formatHumanDate(dStr, true);
      document.getElementById("next-day-title").textContent = formatHumanDate(nextStr, false);

      // Overnight shifts ending on dStr morning
      const overnight = events.filter(e => !e.isAllDay && e.startDate < dStr && e.endDate === dStr);
      const ovBanner = document.getElementById("overnight-banner");
      if (overnight.length > 0) {
        const sh = overnight[0];
        ovBanner.classList.remove("hidden");
        ovBanner.innerHTML = `
          <div class="font-semibold text-indigo-600 dark:text-indigo-400">
            🌙 Nachtschicht vom Vorabend bis ${sh.endTime} Uhr
          </div>
        `;
      } else {
        ovBanner.classList.add("hidden");
      }

      const dayEvents = events.filter(e => e.startDate === dStr);
      const container = document.getElementById("selected-day-events");
      if (dayEvents.length === 0) {
        container.innerHTML = `
          <div class="bg-[var(--content)] border border-[var(--border)] rounded-xl p-5 text-center space-y-1">
            <div class="text-xl">🌿</div>
            <div class="text-sm font-semibold text-[var(--foreground)]">Keine Termine eingetragen</div>
          </div>
        `;
      } else {
        container.innerHTML = dayEvents.map(e => renderEventCard(e, false)).join("");
      }

      // Compact Shift Hint (only shown when relevant)
      const nextEvents = events.filter(e => e.startDate === nextStr);
      const earlyShiftTomorrow = nextEvents.find(e => e.category === "shift" && e.badge === "Frühschicht");
      const nightShiftToday = dayEvents.find(e => e.category === "shift" && e.badge === "Nachtschicht");
      const tipEl = document.getElementById("daily-smart-tip");

      if (nightShiftToday) {
        tipEl.classList.remove("hidden");
        tipEl.innerHTML = `<span>🌙</span><span>Heute Nachtschicht ab <strong>${nightShiftToday.startTime} Uhr</strong></span>`;
      } else if (earlyShiftTomorrow) {
        tipEl.classList.remove("hidden");
        tipEl.innerHTML = `<span>⏰</span><span>Morgen Frühschicht ab <strong>${earlyShiftTomorrow.startTime} Uhr</strong></span>`;
      } else {
        tipEl.classList.add("hidden");
        tipEl.innerHTML = "";
      }

      // Next Day Preview
      const nextContainer = document.getElementById("next-day-events");
      if (nextEvents.length === 0) {
        nextContainer.innerHTML = `<div class="text-xs text-[var(--muted-foreground)] py-2">Keine Einträge am Folgetag.</div>`;
      } else {
        nextContainer.innerHTML = nextEvents.map(e => renderEventCard(e, true)).join("");
      }
    }

    function renderStats() {
      const today = getLiveToday();
      const futureEvents = (appState.data.events || []).filter(e => e.startDate >= today);
      const shifts = futureEvents.filter(e => e.category === "shift");
      const early = shifts.filter(e => e.badge === "Frühschicht").length;
      const late = shifts.filter(e => e.badge === "Spätschicht").length;
      const night = shifts.filter(e => e.badge === "Nachtschicht").length;
      const familyEvents = futureEvents.filter(e => e.category === "family" || e.category === "holiday").length;

      document.getElementById("stats-grid").innerHTML = `
        <div class="bg-[var(--content)] border border-[var(--border)] rounded-xl p-3">
          <div class="text-xs text-[var(--muted-foreground)]">🚑 Dienste</div>
          <div class="text-lg font-bold text-[var(--foreground)] mt-0.5">${shifts.length}</div>
          <div class="text-[11px] text-[var(--muted-foreground)] mt-0.5">${early}F • ${late}S • ${night}N</div>
        </div>
        <div class="bg-[var(--content)] border border-[var(--border)] rounded-xl p-3">
          <div class="text-xs text-[var(--muted-foreground)]">💛 Familie</div>
          <div class="text-lg font-bold text-[var(--foreground)] mt-0.5">${familyEvents}</div>
          <div class="text-[11px] text-[var(--muted-foreground)] mt-0.5">Termine & Feiertage</div>
        </div>
      `;
    }

    function renderTimeline() {
      const query = (document.getElementById("search-input").value || "").trim().toLowerCase();
      const today = getLiveToday();
      const events = (appState.data.events || []).filter(e => e.startDate >= today);

      const filtered = events.filter(e => {
        if (appState.categoryFilter !== "all" && e.category !== appState.categoryFilter) return false;
        if (!query) return true;
        const hay = `${e.summary} ${e.description} ${e.location} ${e.calendarName} ${e.who}`.toLowerCase();
        return hay.includes(query);
      });

      document.querySelectorAll(".filter-btn").forEach(btn => {
        const active = btn.getAttribute("data-filter") === appState.categoryFilter;
        btn.className = active
          ? "filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer bg-emerald-600 text-white border-emerald-600"
          : "filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer bg-[var(--content)] text-[var(--foreground)] border-[var(--border)] hover:opacity-80";
      });

      const container = document.getElementById("timeline-container");
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-xs text-[var(--muted-foreground)] py-6 text-center">Keine passenden Termine gefunden.</div>`;
        return;
      }

      // Group by date
      const grouped = {};
      filtered.forEach(e => {
        if (!grouped[e.startDate]) grouped[e.startDate] = [];
        grouped[e.startDate].push(e);
      });

      container.innerHTML = Object.keys(grouped).map(dStr => {
        const dayEvs = grouped[dStr];
        const isToday = dStr === today;
        return `
          <div class="space-y-2 pt-2">
            <div class="flex items-center gap-2">
              <button onclick="selectDate('${dStr}')" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg border cursor-pointer ${isToday ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'bg-[var(--content)] text-[var(--foreground)] border-[var(--border)]'}">
                ${isToday ? "HEUTE • " : ""}${formatHumanDate(dStr, false)}
              </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              ${dayEvs.map(ev => renderEventCard(ev, false)).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    function buildBriefingText(dStr) {
      const nextStr = addDays(dStr, 1);
      const events = appState.data.events || [];
      const overnight = events.filter(e => !e.isAllDay && e.startDate < dStr && e.endDate === dStr);
      const dayEvents = events.filter(e => e.startDate === dStr);
      const nextEvents = events.filter(e => e.startDate === nextStr);

      let lines = [`👨‍👩‍👧 *Familien-Briefing • ${formatHumanDate(dStr, true)}*`, ""];

      if (overnight.length > 0) {
        overnight.forEach(sh => {
          lines.push(`🌙 *Nachtschicht vom Vorabend:* endet um ${sh.endTime} Uhr (${sh.cleanTitle}) – vormittags Ruhezeit!`);
        });
        lines.push("");
      }

      if (dayEvents.length === 0) {
        lines.push("🌿 Heute stehen keine Termine im Familienkalender.");
      } else {
        lines.push(`📌 *Heute geplant (${dayEvents.length}):*`);
        dayEvents.forEach(e => {
          const t = e.isAllDay ? "Ganztägig" : `${e.startTime}–${e.endTime} Uhr`;
          let details = "";
          if (e.category === "shift") {
            const parts = [e.meta?.Wache, e.meta?.Fahrzeug, e.meta?.PartnerIn].filter(Boolean);
            if (parts.length) details = ` — ${parts.join(" • ")}`;
          } else if (e.location) {
            details = ` (${e.location.replace(/\n/g, ", ")})`;
          }
          lines.push(`• ${e.icon} *${t}:* ${e.cleanTitle}${details}`);
        });
      }

      if (nextEvents.length > 0) {
        lines.push("");
        lines.push(`⏭ *Vorschau Morgen (${formatShortDate(nextStr)}):*`);
        nextEvents.forEach(e => {
          const t = e.isAllDay ? "Ganztägig" : `${e.startTime}–${e.endTime} Uhr`;
          lines.push(`• ${e.icon} ${t}: ${e.cleanTitle}`);
        });
      }

      return lines.join("\n");
    }

    async function triggerBriefingNotification() {
      const dStr = appState.selectedDate;
      const drawer = document.getElementById("briefing-drawer");
      const statusEl = document.getElementById("drawer-status");
      const textEl = document.getElementById("drawer-text");
      const titleEl = document.getElementById("drawer-title");

      titleEl.textContent = `Tages-Briefing für ${formatHumanDate(dStr, false)}`;
      textEl.textContent = buildBriefingText(dStr);
      drawer.classList.remove("hidden");

      if (window.location.protocol.startsWith("http")) {
        try {
          statusEl.textContent = "Sende macOS Mitteilung…";
          const res = await fetch("/api/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ date: dStr })
          });
          if (res.ok) {
            statusEl.textContent = "✓ Native macOS-Benachrichtigung gesendet!";
          }
        } catch (err) {
          statusEl.textContent = "Vorschau bereit zum Kopieren";
        }
      } else {
        statusEl.textContent = "Vorschau bereit zum Kopieren";
      }
    }

    function closeBriefingDrawer() {
      document.getElementById("briefing-drawer").classList.add("hidden");
    }

    function toggleIphoneDrawer() {
      document.getElementById("iphone-drawer").classList.toggle("hidden");
    }

    function copyBriefingText() {
      const txt = document.getElementById("drawer-text").textContent;
      navigator.clipboard.writeText(txt);
      const btn = document.getElementById("btn-copy-briefing");
      btn.textContent = "✓ Kopiert!";
      setTimeout(() => {
        btn.textContent = "📋 Für WhatsApp / iMessage kopieren";
      }, 2000);
    }

    const CLOUD_JSON_URL = "https://script.google.com/macros/s/AKfycbxgGlzzc4YtUd-t80qJjSrN454dGvn3LRXMbFQXynVSXWO_SqNIgVm16ylT0T55SoSW/exec?json=1";

    function normalizeCloudData(data) {
      if (!data || !Array.isArray(data.events)) return data;
      // Deduplicate schichttagebuch double imports & parse meta if coming from Apps Script ?json=1
      const seenShifts = new Set();
      const normalized = [];
      for (const ev of data.events) {
        const cleanTitle = (ev.cleanTitle || ev.summary || "").replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]\s*/u, "").trim();
        if (ev.category === "shift") {
          const shiftKey = `${ev.startDate}|${ev.startTime}|${cleanTitle}`;
          if (seenShifts.has(shiftKey)) continue;
          seenShifts.add(shiftKey);
        }
        const meta = ev.meta ? { ...ev.meta } : {};
        if (Object.keys(meta).length === 0 && ev.description) {
          const parts = ev.description.split(/\s*(?:•|\||\n)\s*/);
          for (const p of parts) {
            const idx = p.indexOf(":");
            if (idx > 0 && idx < 25) {
              const k = p.slice(0, idx).trim();
              const v = p.slice(idx + 1).trim();
              if (k && v) meta[k] = v;
            }
          }
        }
        normalized.push({
          ...ev,
          cleanTitle: cleanTitle || ev.summary,
          who: ev.who || (ev.summary && ev.summary.includes("Huber") ? "Veronika" : "Johannes"),
          meta
        });
      }
      normalized.sort((a, b) => `${a.startDate}T${a.startTime}`.localeCompare(`${b.startDate}T${b.startTime}`));
      return { ...data, events: normalized };
    }

    async function refreshCalendarData(manualForce = true) {
      const icon = document.getElementById("refresh-icon");
      if (icon) icon.classList.add("animate-spin");
      if (window.location.protocol.startsWith("http")) {
        const isLocalServer = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" || window.location.hostname.startsWith("192.168.");
        try {
          if (isLocalServer && manualForce) {
            const res = await fetch("/api/refresh", { method: "POST" });
            if (res.ok) {
              const payload = await res.json();
              if (payload.ok && payload.data) {
                appState.data = normalizeCloudData(payload.data);
                try { localStorage.setItem("familien_dashboard_cache", JSON.stringify(appState.data)); } catch (e) {}
                renderAll();
              }
            }
          } else if (isLocalServer) {
            const res = await fetch(`/api/events?t=${Date.now()}`, { cache: "no-store" });
            if (res.ok) {
              const data = await res.json();
              if (data && data.events) {
                appState.data = normalizeCloudData(data);
                try { localStorage.setItem("familien_dashboard_cache", JSON.stringify(appState.data)); } catch (e) {}
                renderAll();
              }
            }
          } else {
            // Cloud-Modus (z.B. GitHub Pages über 5G/LTE oder WLAN): Hole Live-JSON direkt aus Google Calendar API (?json=1)
            const res = await fetch(CLOUD_JSON_URL, { cache: "no-store" });
            if (res.ok) {
              const data = await res.json();
              if (data && data.events) {
                appState.data = normalizeCloudData(data);
                try { localStorage.setItem("familien_dashboard_cache", JSON.stringify(appState.data)); } catch (e) {}
                renderAll();
              }
            }
          }
        } catch (e) {
          console.warn("Lokaler Server nicht erreichbar, nutze Google Cloud-JSON Fallback:", e);
          try {
            const res = await fetch(CLOUD_JSON_URL, { cache: "no-store" });
            if (res.ok) {
              const data = await res.json();
              if (data && data.events) {
                appState.data = normalizeCloudData(data);
                try { localStorage.setItem("familien_dashboard_cache", JSON.stringify(appState.data)); } catch (err) {}
                renderAll();
              }
            }
          } catch (cloudErr) {
            console.warn(cloudErr);
          }
        }
      } else {
        renderAll();
      }
      if (icon) setTimeout(() => icon.classList.remove("animate-spin"), 500);
    }

    function selectDate(dStr) {
      appState.selectedDate = dStr;
      renderDayStrip();
      renderSelectedDay();
    }

    function selectToday() {
      selectDate(getLiveToday());
    }

    function stepSelectedDay(delta) {
      selectDate(addDays(appState.selectedDate, delta));
    }

    function setCategoryFilter(cat) {
      appState.categoryFilter = cat;
      renderTimeline();
    }

    let lastSyncTimestamp = Date.now();

    async function checkDayRolloverAndSync(forceFetch = false) {
      const liveToday = getLiveToday();
      const dayChanged = liveToday !== appState.lastKnownToday;
      if (dayChanged) {
        appState.lastKnownToday = liveToday;
        appState.selectedDate = liveToday;
        renderAll();
      }
      const minutesSinceSync = (Date.now() - lastSyncTimestamp) / 60000;
      if (dayChanged || forceFetch || appState.data.todayDate !== liveToday || minutesSinceSync >= 5) {
        lastSyncTimestamp = Date.now();
        await refreshCalendarData(false);
      }
    }

    function renderAll() {
      document.getElementById("sync-badge").textContent = `Stand: ${appState.data.generatedAtFormatted || "Live"}`;
      renderDayStrip();
      renderSelectedDay();
      renderStats();
      renderTimeline();
    }

    renderAll();
    checkDayRolloverAndSync(true);
    window.addEventListener("focus", () => checkDayRolloverAndSync(false));
    window.addEventListener("pageshow", () => checkDayRolloverAndSync(false));
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkDayRolloverAndSync(false);
    });
    setInterval(() => checkDayRolloverAndSync(false), 30000);
  </script>
</body>
